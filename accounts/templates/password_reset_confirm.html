{% extends "base.html" %}
{% load i18n %}
{% load static %}

{% block title %}Set New Password - CMS{% endblock %}

{% block content %}
<section class="min-h-[90vh] flex items-center justify-center p-4 md:p-8 bg-slate-50 dark:bg-slate-950 font-sans transition-colors duration-200">
  <div class="max-w-md w-full bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-xl p-8 space-y-6">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-sky-50 dark:bg-sky-950/60 text-sky-600 dark:text-sky-400 flex items-center justify-center text-xl border border-sky-100 dark:border-sky-900/50 shadow-sm">
        <i class="fas fa-lock"></i>
      </div>
      <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">{% trans "Set New Password" %}</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400">{% trans "Create a secure, fresh password for your clinic account" %}</p>
    </div>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      
      <div>
        <label for="new_password1" class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">{% trans "New Password" %}</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fas fa-lock text-xs"></i>
          </span>
          <input 
            type="password" 
            id="new_password1" 
            name="new_password1" 
            class="w-full pl-10 pr-10 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-medium text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all" 
            placeholder="Minimum 8 characters" 
            required
          >
          <button type="button" onclick="togglePasswordVisibility('new_password1')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            <i class="far fa-eye text-xs"></i>
          </button>
        </div>
      </div>

      <div>
        <label for="new_password2" class="block text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">{% trans "Confirm New Password" %}</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
            <i class="fas fa-circle-check text-xs"></i>
          </span>
          <input 
            type="password" 
            id="new_password2" 
            name="new_password2" 
            class="w-full pl-10 pr-10 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-xs font-medium text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all" 
            placeholder="Confirm new password" 
            required
          >
          <button type="button" onclick="togglePasswordVisibility('new_password2')" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            <i class="far fa-eye text-xs"></i>
          </button>
        </div>
      </div>

      <div class="pt-2">
        <button type="submit" class="w-full inline-flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl text-xs font-bold text-white bg-sky-600 hover:bg-sky-700 shadow-md shadow-sky-500/20 transition-all">
          <i class="fas fa-check"></i>
          <span>{% trans "Save New Password" %}</span>
        </button>
      </div>
    </form>
  </div>
</section>

<script>
  function togglePasswordVisibility(fieldId) {
    const field = document.getElementById(fieldId);
    if (!field) return;
    field.type = field.type === 'password' ? 'text' : 'password';
  }
</script>
{% endblock %}
