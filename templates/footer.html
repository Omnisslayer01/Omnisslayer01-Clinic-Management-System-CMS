{% load static i18n %}

<footer class="bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl border-t border-slate-200/80 dark:border-slate-800/80 mt-auto transition-colors duration-200">
  <div class="max-w-7xl mx-auto px-4 md:px-8 py-8 md:py-10">
    <div class="flex flex-col md:flex-row justify-between items-center gap-6 pb-8 border-b border-slate-100 dark:border-slate-800">
      <!-- Logo and Company Info -->
      <div class="flex items-center gap-3">
        <div class="p-1.5 rounded-xl bg-gradient-to-br from-sky-500 to-blue-600 text-white shadow-sm overflow-hidden">
          <img src="{% static 'cms_logo.png' %}" alt="CMS Logo" class="w-7 h-7 object-contain rounded-lg">
        </div>
        <div>
          <h3 class="font-extrabold text-sm text-slate-900 dark:text-white tracking-tight">
            CMS
          </h3>
          <p class="text-[11px] font-semibold text-slate-400 dark:text-slate-500">Clinic Management System &bull; v2.0</p>
        </div>
      </div>
      
      <!-- Action Buttons -->
      <div class="flex items-center gap-3">
        <!-- Dark mode toggle -->
        <button 
          onclick="(window.CmsTheme || window.ImhotepTheme) ? (window.CmsTheme || window.ImhotepTheme).toggle() : toggleTheme()" 
          type="button" 
          aria-label="Toggle theme"
          class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white bg-slate-50 dark:bg-slate-800/60 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
        >
          <i class="fas fa-circle-half-stroke text-xs text-sky-500"></i>
        </button>
        <a href="https://tally.so/r/nPKe1P" target="_blank" rel="noopener noreferrer" 
           class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold text-white bg-sky-600 hover:bg-sky-700 shadow-sm shadow-sky-500/20 transition-all">
          <i class="fas fa-comment-dots text-xs"></i>
          <span>Share Feedback</span>
        </a>
      </div>
    </div>
    
    <div class="flex flex-col md:flex-row justify-between items-center gap-4 pt-6 text-xs text-slate-500 dark:text-slate-400">
      <!-- Links -->
      <div class="flex flex-wrap justify-center md:justify-start items-center gap-5">
        <a href="/" class="hover:text-sky-600 dark:hover:text-sky-400 transition-colors font-medium">{% trans "Clinic Management System" %}</a>
        <a href="/terms" class="hover:text-sky-600 dark:hover:text-sky-400 transition-colors font-medium">{% trans "Terms of Service" %}</a>
        <a href="/privacy" class="hover:text-sky-600 dark:hover:text-sky-400 transition-colors font-medium">{% trans "Privacy Policy" %}</a>
      </div>
      
      <!-- Social Media Icons & Copyright -->
      <div class="flex items-center gap-4">
        <p class="text-[11px] text-slate-400">
          &copy; 2026 Clinic Management System (CMS). All rights reserved.
        </p>
      </div>
    </div>
  </div>
</footer>
