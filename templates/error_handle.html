{% load static i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error {{ error_code }} - CMS</title>
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <link rel="shortcut icon" href="{% static 'cms_logo.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'] },
            colors: {
              brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0284c7', 600: '#0369a1', 700: '#075985' }
            }
          }
        }
      }
    </script>
    <script>
      if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 font-sans min-h-screen flex items-center justify-center p-4 transition-colors duration-200">
    <div class="max-w-md w-full p-8 rounded-3xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xl text-center space-y-6">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-rose-50 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 flex items-center justify-center text-2xl border border-rose-100 dark:border-rose-900/50">
            <i class="fas fa-triangle-exclamation"></i>
        </div>

        <div>
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 mb-2">
                HTTP Status {{ error_code }}
            </span>
            <h1 class="text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">{% trans "Something went off course" %}</h1>
            <p class="mt-2 text-xs text-slate-500 dark:text-slate-400 leading-relaxed">{{ error_description }}</p>
        </div>

        <div class="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/60 dark:border-slate-700/50">
            <p class="text-[11px] text-slate-400 font-semibold uppercase tracking-wider mb-1">Redirecting to Safety</p>
            <p class="text-2xl font-black text-sky-600 dark:text-sky-400">
                <span id="countdown">10</span> <span class="text-xs font-medium text-slate-400">seconds</span>
            </p>
        </div>

        <div class="flex flex-col sm:flex-row gap-3">
            <a href="/" class="flex-1 inline-flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl text-xs font-bold text-white bg-sky-600 hover:bg-sky-700 shadow-md shadow-sky-500/20 transition-all">
                <i class="fas fa-house"></i>
                <span>{% trans "Return Home" %}</span>
            </a>
            <button onclick="history.back()" class="flex-1 inline-flex items-center justify-center gap-2 py-2.5 px-4 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                <i class="fas fa-arrow-left"></i>
                <span>Go Back</span>
            </button>
        </div>
    </div>

    <script>
    (function(){
        var s = 10, el = document.getElementById('countdown');
        var t = setInterval(function(){
            s -= 1;
            if (el) el.textContent = String(s);
            if (s <= 0) {
                clearInterval(t);
                window.location.href = '/';
            }
        }, 1000);
    })();
    </script>
</body>
</html>
